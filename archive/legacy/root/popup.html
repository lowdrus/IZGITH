<button onclick="downloadChat()">📥 CONVGPT</button>

<h3>Logs</h3>
<div id="log" style="height:200px;overflow:auto;border:1px solid #00ff88;padding:5px"></div>

<script>
function log(msg){
  const el=document.getElementById("log");
  el.innerHTML += "["+new Date().toLocaleTimeString()+"] "+msg+"<br>";
}

function run(type){
  log("Executado: "+type);
}

async function downloadChat(){
  try{
    const [tab] = await chrome.tabs.query({active:true,currentWindow:true});
    await chrome.scripting.executeScript({
      target: {tabId: tab.id},
      func: () => {
        const msgs = document.body.innerText;
        const blob = new Blob([msgs], {type:"text/plain"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "chat_history.txt";
        a.click();
      }
    });
    log("Download iniciado");
  }catch(e){
    log("Erro: "+e.message);
  }
}
</script>

</body>

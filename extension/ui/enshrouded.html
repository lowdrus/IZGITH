<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IZGITH · ENSHROUDED MANAGER</title><style>body{margin:0;background:#071018;color:#eff7ff;font:14px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{border:1px solid #20354f;border-radius:18px;background:#0d1826dd;padding:18px;box-shadow:0 18px 50px #0008}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:2fr 2fr 1fr 2fr;gap:8px;margin-top:12px}input{background:#08121f;color:#eff7ff;border:1px solid #20354f;border-radius:9px;padding:10px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.btn{border:1px solid #2d5d8d;border-radius:9px;background:#12253b;color:#fff;padding:8px 11px;font-weight:700;cursor:pointer}.btn:hover{border-color:#5aa7ff}.result{margin-top:12px;padding:10px;border:1px solid #20354f;border-radius:9px;white-space:pre-wrap;color:#8da6bf}.muted{color:#8da6bf}.title{font-size:22px;font-weight:900}.badge{font-size:11px;border:1px solid #20354f;border-radius:999px;padding:5px 9px;color:#48dfa8}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><div class="head"><div><div class="title">ENSHROUDED MANAGER</div><div class="muted">Gerenciamento preparado para o container de servidor; esta tela não inicia processos externos automaticamente.</div></div><span class="badge">IZGITH</span></div><div class="grid"><input id="serverName" placeholder="Nome do servidor"><input id="serverHost" placeholder="Endereço ou IP"><input id="serverPort" type="number" min="1" max="65535" value="15636" placeholder="Porta"><input id="serverNotes" placeholder="Observações"></div><div class="actions" id="actions"></div><div class="actions"><button class="btn" id="save">Salvar perfil</button><button class="btn" id="validate">Validar</button><button class="btn" id="clear">Limpar</button><button class="btn" id="config">Baixar Config</button><button class="btn" id="compose">Baixar Compose</button><button class="btn" id="plan">Baixar Plano</button></div><div id="result" class="result">Pronto.</div></div></div><script src="../integrations/enshrouded-manager.js"></script><script src="enshrouded-manager-screen.js"></script></body></html>

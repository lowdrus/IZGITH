name: Build recovered package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build recovery ZIP
        run: python3 scripts/build_recovered_package.py

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: IZGITH-full-recovered
          path: dist/*_FULL_RECOVERED.zip
          if-no-files-found: error

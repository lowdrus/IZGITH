name: CI
on:
  push:
    branches: [main, develop, "fix/**", "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar-e-empacotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validar projeto e executar testes
        run: npm test
      - name: Validar shell do instalador
        run: sh -n host-python/installers/install_host_unix.sh
      - name: Compilar fontes Python
        run: python -m compileall -q host-python scripts tools tests
      - name: Criar pacote da extensão
        run: npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: IZGITH-extension
          path: dist/IZGITH-extension-*.zip
          if-no-files-found: error
          retention-days: 30

name: IZGITH CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: python scripts/package_extension.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: IZGITH-extension
          path: dist/*

name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validar versão da tag
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os
          version=json.load(open('extension/manifest.json',encoding='utf-8'))['version']
          tag=os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}': raise SystemExit(f'Tag {tag} não corresponde à versão v{version}')
          PY
      - name: Testar e empacotar
        run: npm test && npm run package
      - name: Empacotar host local
        run: |
          mkdir -p dist/host-source
          cp host-python/ext_host.py host-python/install_host.py dist/host-source/
          cp -r host-python/installers dist/host-source/
          (cd dist/host-source && zip -r ../IZGITH-host-source-${GITHUB_REF_NAME}.zip .)
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Publicar release no GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --generate-notes --title "IZGITH $GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v6
        with:
          name: IZGITH-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

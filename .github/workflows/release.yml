name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify tag
        run: |
          python - <<'PY'
          import json,os
          version=json.load(open('extension/manifest.json',encoding='utf-8'))['version'];tag=os.environ['GITHUB_REF_NAME']
          if tag!=f'v{version}': raise SystemExit(f'{tag} != v{version}')
          PY
      - name: Package
        run: |
          mkdir -p dist/host-source
          (cd extension && zip -r ../dist/IZGITH-extension-${GITHUB_REF_NAME}.zip .)
          cp host-python/ext_host.py host-python/install_host.py -t dist/host-source/
          cp -r host-python/installers dist/host-source/
          (cd dist/host-source && zip -r ../IZGITH-host-source-${GITHUB_REF_NAME}.zip .)
          sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/IZGITH-extension-*.zip
            dist/IZGITH-host-source-*.zip
            dist/SHA256SUMS.txt
